name: CI
on:
  push:
    branches:
      - "feat/api-catalogue"
  pull_request:
    branches:
      - "feat/api-catalogue"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: catalogue_api 
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: catalogue_api/package-lock.json
      - run: npm ci
      - run: npm run build --if-present
      - run: npm test
        continue-on-error: true
