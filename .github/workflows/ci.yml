name: CI
on:
  push:
    branches:
      - "feat/api-catalogue"
  pull_request:
    branches:
      - "feat/api-catalogue"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm run build --if-present
      - run: npm test
